name: Import generated Artham branding assets

on:
  push:
    branches:
      - feature/branding-app-icon-splash
    paths:
      - 'artham-branding-generated.zip'

permissions:
  contents: write

jobs:
  import-branding-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branding branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Validate and extract generated assets
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile

          archive = Path("artham-branding-generated.zip")
          root = Path.cwd().resolve()
          allowed = (
              "android/app/src/main/res/",
              "assets/branding/",
              "ios/Runner.xcodeproj/",
              "ios/Runner/",
              "pubspec.lock",
              "web/",
          )

          with zipfile.ZipFile(archive) as z:
              entries = [i for i in z.infolist() if not i.is_dir()]
              if len(entries) != 77:
                  raise SystemExit(f"Expected 77 files, found {len(entries)}")

              for info in entries:
                  path = PurePosixPath(info.filename)
                  name = path.as_posix()

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {name}")
                  if not any(name.startswith(prefix) for prefix in allowed):
                      raise SystemExit(f"Unexpected file path: {name}")

                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f"Symbolic links are not allowed: {name}")

                  target = (root / Path(*path.parts)).resolve()
                  if root not in target.parents:
                      raise SystemExit(f"Archive path escapes repository: {name}")

                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))

          print(f"Extracted and validated {len(entries)} branding files.")
          PY
          rm artham-branding-generated.zip

      - name: Commit generated assets to branding branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated branding changes to commit."
            exit 0
          fi
          git commit -m "chore(branding): add generated launcher and splash assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
