name: Flutter CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze, test, and build Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate generated merchant catalogue
        run: python tool/generate_merchant_catalog.py --check

      - name: Check Dart formatting
        run: dart format --output=none lib test

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload Android release APK and resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: artham-stage-8-data-export-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            pubspec.lock
          if-no-files-found: error
          retention-days: 7

      - name: Run Android JVM tests
        working-directory: android
        run: gradle :app:testDebugUnitTest
